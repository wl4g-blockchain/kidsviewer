# KidsViewer Server Configuration Example
# Copy this file to config.yaml and modify as needed

server:
  address: '0.0.0.0'
  port: 9988
  read-timeout: 30
  write-timeout: 30
  shutdown-timeout: 30
  cors:
    allow-origins: ['*']
    allow-methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
    allow-headers: ['*']
    allow-credentials: true
    max-age: 43200 # 12 hours

logging:
  root-level: 'INFO' # DEBUG, INFO, WARN, ERROR
  format: 'json' # json or text

database:
  type: 'sqlite' # sqlite｜postgres
  sqlite:
    dsn: './data/kidsviewer.db'
    max-open-conns: 25
    max-idle-conns: 5
    conn-max-lifetime: '5m'
    pragma:
      journal_mode: 'WAL'
      synchronous: 'NORMAL'
      foreign_keys: 'ON'
  postgres:
    host: 'localhost'
    port: 5432
    database: 'kidsviewer'
    username: 'kidsviewer'
    password: 'password'
    ssl-mode: 'disable'
    timezone: 'UTC'
  pool:
    max-open-conns: 25
    max-idle-conns: 5
    conn-max-lifetime: '5m'

cache:
  type: 'memory' # memory｜redis
  memory:
    max-size: 100
    default-expiration: '10m'
    cleanup-interval: '15m'
  redis:
    username: ''
    password: ''
    servers: ['localhost:6379']
    database: 0
    pool-size: 10
    min-idle-conns: 5

jwt:
  secret-key: 'your-secret-key-change-in-production'
  expiration-hours: 24
  issuer: 'kidsviewer-server'

kids-viewer:
  max-daily-time: 120 # minutes
  question-interval: 15 # minutes
  max-wrong-answers: 3 # maximum wrong answers before session ends
  session-timeout: 30 # minutes of inactivity before session expires
