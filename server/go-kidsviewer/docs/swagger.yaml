basePath: /
definitions:
  models.AppSettings:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      language:
        type: string
      settings:
        additionalProperties: true
        type: object
      theme:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  models.CreatePersonRequest:
    properties:
      ageGroup:
        enum:
        - preschool
        - young
        - older
        - teen
        type: string
      avatar:
        type: string
      difficulty:
        type: string
      maxDailyTime:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      parentalPassword:
        type: string
    required:
    - ageGroup
    - name
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.Platform:
    properties:
      ageGroups:
        description: JSON array of age groups
        items:
          type: string
        type: array
      createdAt:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      nameCN:
        type: string
      nameEN:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  models.QuestionTemplate:
    properties:
      ageGroups:
        items:
          type: string
        type: array
      content:
        type: string
      correctAnswer:
        type: string
      createdAt:
        type: string
      difficulty:
        type: string
      enabled:
        type: boolean
      explanationCN:
        type: string
      explanationEN:
        type: string
      id:
        type: integer
      language:
        type: string
      options:
        items:
          type: string
        type: array
      subject:
        type: string
      tags:
        items:
          type: string
        type: array
      type:
        type: string
      updatedAt:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      isParent:
        type: boolean
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.UpdatePersonRequest:
    properties:
      ageGroup:
        type: string
      avatar:
        type: string
      difficulty:
        type: string
      maxDailyTime:
        type: integer
      name:
        type: string
      parentalPassword:
        type: string
    type: object
  models.UpdatePersonSettingsRequest:
    properties:
      difficulty:
        type: string
      maxDailyTime:
        type: integer
      parentalPassword:
        type: string
    type: object
  models.VerifyPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  services.CheckWatchingRequest:
    properties:
      watching_token:
        type: string
    required:
    - watching_token
    type: object
  services.SkipQuestionsRequest:
    properties:
      password:
        type: string
      watching_token:
        type: string
    required:
    - password
    - watching_token
    type: object
  services.StartWatchingRequest:
    properties:
      person_id:
        type: string
      platform_url:
        type: string
    required:
    - person_id
    - platform_url
    type: object
  services.VerifyQuestionRequest:
    properties:
      answer:
        type: string
      question_id:
        type: integer
      watching_token:
        type: string
    required:
    - answer
    - question_id
    - watching_token
    type: object
host: localhost:9988
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: KidsViewer Backend API Documentation
